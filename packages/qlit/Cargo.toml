[package]
name = "qlit"
version = "0.2.0"
license = "MPL-2.0"
description = "Strong exact simulation of Clifford+T quantum circuits"
edition = "2024"

[features]
default = ["gpu"]
gpu = ["wgpu", "pollster"]
rand = ["dep:rand"]

[dependencies]
num-complex = "0.4.6"
num-traits = "0.2.19"
rayon = "1.12.0"
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.0", optional = true }
rand = { version = "0.10.2", optional = true }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"
# Enable the `rand` feature for tests and benches.
qlit = { path = ".", features = ["rand"] }

[[bench]]
name = "bench"
harness = false
